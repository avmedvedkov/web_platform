# Docker Compose для МНПЦЛИ Энтеробиоз

version: '3.8'

services:
  app:
    build: .
    container_name: mnpcli-enterobiasis
    ports:
      - "8001:8001"
    volumes:
      # Сохранение данных сканов
      - ./scans:/app/scans
      # Логи приложения
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0
      - PORT=8001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
