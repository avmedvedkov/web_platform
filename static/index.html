<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>МНПЦЛИ · Распознавание энтеробиоза</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {

      display: flex;

    }

    .nav-badge { margin-left: auto; background: #e2e8f0; color: #334155; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 12px; min-width: 26px; text-align: center; }

    .sidebar-divider { height: 1px; background: #e2e5ea; margin: 12px 14px; }
    .sidebar-status { padding: 16px 20px; border-top: 1px solid #e2e5ea; font-size: 13px; color: #64748b; display: flex; align-items: center; gap: 10px; }
    .status-indicator { width: 10px; height: 10px; border-radius: 50%; background: #16a34a; }
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .header {
      min-height: 56px; background: #ffffff; border-bottom: 1px solid #e2e5ea; display: flex;

    .header-breadcrumb { font-weight: 500; color: #1e293b; font-size: 15px; }

    }
    .robot-dot { width: 10px; height: 10px; border-radius: 50%; background: #16a34a; }
    .content { flex: 1; display: flex; overflow: hidden; }
    .panel-center { flex: 1; display: flex; flex-direction: column; padding: 20px 28px; gap: 16px; }
    .panel-right {
      width: 420px; background: #ffffff; border-left: 1px solid #e2e5ea; display: flex;
      flex-direction: column; overflow-y: auto; padding: 20px 18px; gap: 16px; flex-shrink: 0;
    }
    .slide-selector { display: flex; gap: 10px; flex-wrap: wrap; }
    .slide-tab {
      padding: 12px 22px; border-radius: 28px; font-size: 15px; font-weight: 500; cursor: pointer;
      border: 1.5px solid #d1d5db; background: #ffffff; color: #334155; transition: all 0.15s;
      display: flex; align-items: center; gap: 10px;

    .slide-tab:hover { border-color: #9ca3af; background: #f9fafb; }

    .tab-dot { width: 10px; height: 10px; border-radius: 50%; }
    .tab-dot.pos { background: #dc2626; }
    .tab-dot.err { background: #d97706; }
    .tab-dot.clean { background: #16a34a; }

    .scan-grid-header { display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
    .scan-grid-title { font-weight: 600; color: #0f172a; }
    .scan-grid-legend { display: flex; gap: 20px; font-size: 13px; color: #64748b; }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-box { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; }
    .legend-box.neg { background: #d1d5db; border: 1px solid #9ca3af; }
    .legend-box.pos { background: #fecaca; border: 1px solid #dc2626; }
    .legend-box.err { background: #fed7aa; border: 1px solid #d97706; }
    .legend-box.rev { background: #fff; border: 2px solid #1e4bd2; }
    .scan-grid-container {
      flex: 1; overflow-y: auto; background: #ffffff; border: 1px solid #e2e5ea;
      border-radius: 6px; padding: 16px; display: flex; align-content: flex-start;
      flex-wrap: wrap; gap: 10px;
    }
    .scan-tile {
      width: 120px; height: 120px; border-radius: 6px; cursor: pointer; position: relative;
      border: 2px solid #e2e5ea; background: #fafbfc; transition: border 0.12s, box-shadow 0.12s;
      flex-shrink: 0; overflow: hidden;
    }
    .scan-tile:hover { border-color: #94a3b8; box-shadow: 0 0 0 2px rgba(148,163,184,0.25); }
    .scan-tile.selected { border-color: #1e4bd2 !important; box-shadow: 0 0 0 4px rgba(30,75,210,0.3); }
    .scan-tile.positive { border-color: #fca5a5; background: #fef2f2; }
    .scan-tile.error-scan { border-color: #fcd34d; background: #fffbeb; }
    .scan-tile.needs-review { border-style: dashed; border-color: #1e4bd2; }
    .scan-tile canvas { display: block; width: 100%; height: 100%; }
    .tile-badge {
      position: absolute; top: 5px; right: 6px; font-size: 11px; font-weight: 700;

    .info-row { display: flex; justify-content: space-between; align-items: baseline; }

    .confidence-bar { height: 6px; background: #e2e5ea; border-radius: 3px; overflow: hidden; margin-top: 4px; }
    .confidence-fill { height: 100%; border-radius: 3px; }
    .conf-high { background: #dc2626; }
    .conf-medium { background: #d97706; }

      display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px;

    .status-confirmed { background: #dcfce7; color: #166534; }
    .status-rejected { background: #fee2e2; color: #991b1b; }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-auto { background: #dbeafe; color: #1e40af; }
    .detail-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }
    .detail-actions .btn { width: 100%; }
    .btn {
      padding: 12px 22px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer;

    .mini-thumb { width: 52px; height: 52px; border-radius: 6px; overflow: hidden; flex-shrink: 0; border: 1px solid #e2e5ea; }

    .queue-item-info { flex: 1; }
    .queue-item-slide { font-weight: 600; color: #0f172a; font-size: 14px; }
    .queue-item-meta { font-size: 13px; color: #64748b; }
    .queue-actions { display: flex; gap: 6px; }
    .stats-bar { display: flex; gap: 14px; flex-wrap: wrap; }
    .stat-card {
      background: #ffffff; border: 1px solid #e2e5ea; border-radius: 10px;
      padding: 18px 22px; min-width: 110px; flex: 1; text-align: center;
    }
    .stat-value { font-size: 36px; font-weight: 700; line-height: 1.1; color: #0f172a; }
    .stat-label { font-size: 12px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 6px; }
    .stat-card.pos .stat-value { color: #dc2626; }
    .stat-card.err .stat-value { color: #d97706; }
    .stat-card.pend .stat-value { color: #1e4bd2; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .toast {
      position: fixed; bottom: 28px; right: 28px; background: #1e293b; color: white;
      padding: 14px 28px; border-radius: 10px; font-size: 14px; font-weight: 500;
      z-index: 200; box-shadow: 0 12px 24px rgba(0,0,0,0.2);
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000;
      display: flex; align-items: center; justify-content: center;
    }
    .modal {
      background: white; border-radius: 12px; width: 90vw; max-width: 1200px;
      height: 85vh; display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 24px 48px rgba(0,0,0,0.3);

    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-bottom: 1px solid #e2e5ea; font-weight: 700; font-size: 18px; }
    .modal-close { width: 36px; height: 36px; border-radius: 50%; border: none; background: #f1f5f9; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; }
    .modal-close:hover { background: #e2e5ea; }
    .fullscreen-canvas-container {
      flex: 1; background: #1e293b; position: relative; overflow: hidden;
      cursor: grab;
    }
    .fullscreen-canvas-container:active {
      cursor: grabbing;
    }
    #fullscreenCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .fullscreen-controls {
      display: flex; gap: 12px; padding: 12px 20px; background: #f8fafc; border-top: 1px solid #e2e5ea;
      justify-content: center;
    }
    .fullscreen-controls button {
      padding: 8px 20px; border-radius: 6px; border: 1px solid #cbd5e1; background: white; font-weight: 600;
      cursor: pointer;
    }
    .fullscreen-controls button:hover { background: #eef4ff; }
    .table-wrapper {
      background: #fff;
      border: 1px solid #e2e5ea;
      border-radius: 8px;

      flex: 1;
    }
    table {
      width: 100%;

      font-size: 14px;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #e2e5ea;
    }
    th {
      background: #f8fafc;

      color: #0f172a;
    }

    }
    .settings-group {
      background: #fff; border: 1px solid #e2e5ea; border-radius: 8px; padding: 20px; margin-bottom: 12px;
    }
    .settings-group h3 { margin-bottom: 12px; font-size: 16px; }
    .device-status { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  </style>

</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="favicon.svg" alt="Логотип" class="sidebar-logo-img">
      <span>МНПЦЛИ</span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-item active" data-view="dashboard">Панель управления</div>
      <div class="nav-item" data-view="batch">Текущая партия <span class="nav-badge" id="batchBadge">5</span></div>
      <div class="nav-item" data-view="review">Очередь проверки <span class="nav-badge alert" id="reviewBadge">0</span></div>
      <div class="sidebar-divider"></div>
      <div class="nav-item" data-view="archive">Архив партий</div>
      <div class="nav-item" data-view="reports">Отчёты</div>
      <div class="nav-item" data-view="settings">Настройки</div>
    </nav>
    <div class="sidebar-status">
      <span class="status-indicator"></span> v0.2.0
    </div>
  </aside>

  <div class="main">
    <header class="header">
      <div class="header-breadcrumb">Партия <span id="headerBatchId">#B2026-0429</span> · Загружена 29.04.2026</div>
      <div class="header-info">
        <div class="robot-indicator"><span class="robot-dot"></span> Манипулятор: test</div>
        <div class="robot-indicator"><span class="robot-dot"></span> Робоскоп: test</div>
        <div class="robot-indicator"><span class="robot-dot"></span> Сканер: test</div>
        <span style="font-weight:500;">лаборант — Иванова А.С.</span>
      </div>
    </header>

    <div class="content" id="mainContent">
      <div class="panel-center" id="panelCenter"></div>
      <div class="panel-right" id="panelRight">
        <div class="detail-placeholder" id="detailPlaceholder">
          <div style="font-size:36px;margin-bottom:12px;color:#cbd5e1;">&#9654;</div>
          <div>Выберите изображение стекла для анализа</div>
        </div>
        <div class="detail-active" id="detailActive" style="display:none;"></div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="fullscreenModal" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <span id="fullscreenTitle">Полноэкранный просмотр</span>
        <button class="modal-close" onclick="closeFullscreen()">✕</button>
      </div>
      <div class="fullscreen-canvas-container" id="fullscreenCanvasContainer">
        <canvas id="fullscreenCanvas"></canvas>
      </div>
      <div class="fullscreen-controls">
        <button id="zoomInBtn">+ Увеличить</button>
        <button id="zoomOutBtn">– Уменьшить</button>
        <button id="resetZoomBtn">Сброс</button>
      </div>
    </div>
  </div>
  <div id="toastContainer"></div>

  <script>
    // ---------- Глобальные переменные ----------
    let slidesData = {};
    let statsData = null;
    let selectedSlideId = null;
    let selectedScanIndex = null;
    let reviewQueue = [];

    let fullData = { img: null, detections: null, imgWidth: 1, imgHeight: 1 };
    let scale = 1, offsetX = 0, offsetY = 0;
    let isDragging = false, dragStartX = 0, dragStartY = 0;
    let canvasFull, ctxFull, containerFull;

    // Загрузка данных
    async function fetchSlidesData() {
      try {
        const res = await fetch('/api/slides');
        if (!res.ok) throw new Error('Ошибка загрузки');
        slidesData = await res.json();
        buildReviewQueue();
        updateReviewBadge();
        const ids = Object.keys(slidesData);
        if (ids.length > 0) {
          selectedSlideId = ids[0];
          switchView('batch');
        }
      } catch (e) {
        console.error(e);
        alert('Не удалось загрузить данные с сервера');
      }
    }

    async function fetchStatsData() {
      try {
        const res = await fetch('/api/stats');
        if (res.ok) statsData = await res.json();
      } catch (e) {
        console.warn('Статистика не загружена');
      }
    }

    async function updateReviewStatus(slideId, index, status) {
      const res = await fetch('/api/review', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slideId, index, status })
      });
      if (!res.ok) return false;
      const slide = slidesData[slideId];
      if (slide) {
        slide.scans[index].reviewStatus = status;
        computeStats(slide);
        buildReviewQueue();
        updateReviewBadge();
      }
      return true;
    }

    function computeStats(slide) {
      let pos = 0, neg = 0, err = 0, pend = 0;
      slide.scans.forEach(s => {
        if (s.scanType === 'positive') pos++;
        else if (s.scanType === 'error') err++;
        else neg++;
        if (s.reviewStatus === 'pending') pend++;
      });
      slide.stats = { total: slide.scans.length, positive: pos, negative: neg, errors: err, pendingReview: pend };
    }

    function buildReviewQueue() {
      reviewQueue = [];
      for (const [sid, slide] of Object.entries(slidesData)) {
        slide.scans.forEach((s, idx) => {
          if (s.reviewStatus === 'pending') reviewQueue.push({ slideId: sid, index: idx, scanData: s });
        });
      }
    }

    function updateReviewBadge() {
      const badge = document.getElementById('reviewBadge');
      badge.textContent = reviewQueue.length;
      badge.classList.toggle('alert', reviewQueue.length > 5);
    }

    // Отрисовка детекций с широкой рамкой и отступом
    function drawDetections(ctx, detections, imgW, imgH, canvasW, canvasH) {
      const pad = Math.max(4, canvasW * 0.015);
      detections.forEach(d => {
        let x1 = d.x1 / imgW * canvasW;
        let y1 = d.y1 / imgH * canvasH;
        let x2 = d.x2 / imgW * canvasW;
        let y2 = d.y2 / imgH * canvasH;
        x1 -= pad;
        y1 -= pad;
        x2 += pad;
        y2 += pad;
        const bw = x2 - x1, bh = y2 - y1;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = Math.max(6, canvasW * 0.025);
        ctx.strokeRect(x1, y1, bw, bh);
        ctx.strokeStyle = '#dc2626';
        ctx.lineWidth = Math.max(3, canvasW * 0.012);
        ctx.strokeRect(x1, y1, bw, bh);
        ctx.font = `bold ${Math.max(16, canvasW * 0.045)}px "Segoe UI", Arial`;
        ctx.fillStyle = '#dc2626';
        ctx.fillText(`${Math.round(d.confidence * 100)}%`, x1, y1 - 8);
      });
    }

    // Сетка миниатюр
    function renderScanGrid() {
      const grid = document.getElementById('scanGrid');
      if (!grid) return;
      grid.innerHTML = '';
      const slide = slidesData[selectedSlideId];
      if (!slide) return;
      slide.scans.forEach((scan, idx) => {
        const tile = document.createElement('div');
        tile.className = 'scan-tile';
        if (scan.scanType === 'positive') tile.classList.add('positive');
        if (scan.scanType === 'error') tile.classList.add('error-scan');
        if (scan.reviewStatus === 'pending') tile.classList.add('needs-review');
        const key = `${selectedSlideId}-${idx}`;
        if (idx === selectedScanIndex && selectedSlideId === selectedSlideId) tile.classList.add('selected');
        tile.dataset.key = key;
        tile.dataset.slideId = selectedSlideId;
        tile.dataset.index = idx;
        if (scan.scanType === 'positive' && scan.reviewStatus === 'pending') {
          const badge = document.createElement('span');
          badge.className = 'tile-badge';
          badge.textContent = scan.numEggs;
          tile.appendChild(badge);
        } else if (scan.scanType === 'positive' && scan.reviewStatus === 'confirmed') {
          const badge = document.createElement('span');
          badge.className = 'tile-badge';
          badge.textContent = scan.numEggs;
          tile.appendChild(badge);
        } else if (scan.scanType === 'error') {
          const badge = document.createElement('span');
          badge.className = 'tile-badge err';
          badge.textContent = '!';
          tile.appendChild(badge);
        }
        const coord = document.createElement('span');
        coord.className = 'tile-coord';
        coord.textContent = idx + 1;
        tile.appendChild(coord);
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 120;
        tile.appendChild(canvas);
        tile.addEventListener('click', () => selectScan(selectedSlideId, idx, tile));
        grid.appendChild(tile);
        const img = new Image();
        img.onload = () => {
          const ctx = canvas.getContext('2d');
          canvas.width = 120; canvas.height = 120;
          ctx.drawImage(img, 0, 0, 120, 120);
          if (scan.detections && scan.detections.length > 0) {
            // используем сохранённые исходные размеры

    // ---------- Полноэкранный просмотр с автоцентрированием на первом яйце ----------
    function openFullscreen(slideId, index) {
      const scan = slidesData[slideId]?.scans[index];
      if (!scan) return;
      const modal = document.getElementById('fullscreenModal');
      document.getElementById('fullscreenTitle').textContent = `${slideId} · Стекло ${index+1}`;
      canvasFull = document.getElementById('fullscreenCanvas');
      ctxFull = canvasFull.getContext('2d');
      containerFull = document.getElementById('fullscreenCanvasContainer');
      
      const img = new Image();
      img.onload = () => {
        fullData.img = img;
        fullData.imgWidth = img.naturalWidth;
        fullData.imgHeight = img.naturalHeight;
        fullData.detections = scan.detections;
        fitCanvasToContainer(); // установит размеры canvas
        
        // Автоматическое центрирование на первом яйце (если есть)
        if (fullData.detections && fullData.detections.length > 0) {
          const d = fullData.detections[0];
          const pad = fullData.imgWidth * 0.01; // небольшой отступ вокруг яйца
          const x1 = d.x1 - pad, y1 = d.y1 - pad, x2 = d.x2 + pad, y2 = d.y2 + pad;
          const objW = x2 - x1, objH = y2 - y1;
          if (objW > 0 && objH > 0) {
            scale = Math.min(canvasFull.width / objW, canvasFull.height / objH) * 0.55;
            if (scale < 0.2) scale = 0.2;
            if (scale > 8) scale = 8;
            const centerX = (x1 + x2) / 2;
            const centerY = (y1 + y2) / 2;
            offsetX = canvasFull.width/2 - centerX * scale;
            offsetY = canvasFull.height/2 - centerY * scale;
          } else { scale = 1; offsetX = 0; offsetY = 0; }
        } else {
          scale = 1; offsetX = 0; offsetY = 0;
        }
        drawFullscreen();
      };
      img.src = scan.imgUrl;
      modal.style.display = 'flex';
      
      function onWheel(e) {
        e.preventDefault();
        const rect = canvasFull.getBoundingClientRect();
        const mouseX = (e.clientX - rect.left) / rect.width;
        const mouseY = (e.clientY - rect.top) / rect.height;
        const delta = e.deltaY > 0 ? 0.9 : 1.1;
        const newScale = scale * delta;
        if (newScale < 0.2 || newScale > 8) return;
        const dx = (mouseX - 0.5) * canvasFull.width;
        const dy = (mouseY - 0.5) * canvasFull.height;
        offsetX = (offsetX - dx) * (newScale / scale) + dx;
        offsetY = (offsetY - dy) * (newScale / scale) + dy;
        scale = newScale;
        drawFullscreen();
    }
      
      function onMouseDown(e) {
        isDragging = true;
        dragStartX = e.clientX - offsetX;
        dragStartY = e.clientY - offsetY;
        canvasFull.style.cursor = 'grabbing';
      }
      
      function onMouseMove(e) {
        if (!isDragging) return;
        offsetX = e.clientX - dragStartX;
        offsetY = e.clientY - dragStartY;
        drawFullscreen();
      }
      
      function onMouseUp() {
        isDragging = false;
        canvasFull.style.cursor = 'grab';
      }
      
      function fitCanvasToContainer() {
        const containerRect = containerFull.getBoundingClientRect();
        canvasFull.width = containerRect.width;
        canvasFull.height = containerRect.height;
      }
      
      const resizeObserver = new ResizeObserver(() => {
        fitCanvasToContainer();
        drawFullscreen();
      });
      resizeObserver.observe(containerFull);
      
      canvasFull.addEventListener('wheel', onWheel, { passive: false });
      canvasFull.addEventListener('mousedown', onMouseDown);
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
      canvasFull.style.cursor = 'grab';
      
      const cleanup = () => {
        canvasFull.removeEventListener('wheel', onWheel);
        canvasFull.removeEventListener('mousedown', onMouseDown);
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('mouseup', onMouseUp);
        resizeObserver.disconnect();
      };
      
      document.getElementById('zoomInBtn').onclick = () => {
        scale *= 1.2;
        if (scale > 8) scale = 8;
        drawFullscreen();
      };
      document.getElementById('zoomOutBtn').onclick = () => {
        scale /= 1.2;
        if (scale < 0.2) scale = 0.2;
        drawFullscreen();
      };
      document.getElementById('resetZoomBtn').onclick = () => {
        // При сбросе возвращаем масштаб 1 и центрируем изображение (не яйцо)
        scale = 1;
        offsetX = 0;
        offsetY = 0;
        drawFullscreen();
      };
      
      window.closeFullscreen = () => {
        modal.style.display = 'none';
        cleanup();
      };
    }
    
    function drawFullscreen() {
      if (!ctxFull || !fullData.img) return;
      const w = canvasFull.width, h = canvasFull.height;
      ctxFull.clearRect(0, 0, w, h);
      ctxFull.save();
      ctxFull.translate(offsetX, offsetY);
      ctxFull.scale(scale, scale);
      const imgW = fullData.imgWidth, imgH = fullData.imgHeight;
      ctxFull.drawImage(fullData.img, 0, 0, imgW, imgH);
      
      if (fullData.detections && fullData.detections.length) {
        const pad = Math.max(5, imgW * 0.005);
        fullData.detections.forEach(d => {
          let x1 = d.x1 - pad;
          let y1 = d.y1 - pad;
          let x2 = d.x2 + pad;
          let y2 = d.y2 + pad;
          
          ctxFull.strokeStyle = '#ffffff';
          ctxFull.lineWidth = Math.max(3, 6 / scale);
          ctxFull.strokeRect(x1, y1, x2 - x1, y2 - y1);
          
          ctxFull.strokeStyle = '#dc2626';
          ctxFull.lineWidth = Math.max(1.5, 3 / scale);
          ctxFull.strokeRect(x1, y1, x2 - x1, y2 - y1);
          
          ctxFull.font = `bold ${Math.max(14, 20 / scale)}px "Segoe UI", Arial`;
          ctxFull.fillStyle = '#dc2626';
          ctxFull.fillText(`${Math.round(d.confidence * 100)}%`, x1, y1 - 6 / scale);
        });
      }
      ctxFull.restore();
    }

    function renderStats() {
      const container = document.getElementById('statsContent');
      if (!container || !statsData) return;

        <p>Всего файлов: <strong>${statsData.total_files}</strong></p>
        <p>Общее время: <strong>${statsData.total_time} сек</strong> (в т.ч. инференс: ${statsData.inference_time} сек)</p>
        <p>Среднее время на файл: <strong>${statsData.average_inference_ms} мс</strong></p>
        <p>Средняя скорость: <strong>${statsData.speed} файлов/с</strong></p>
        <p style="margin-top:8px;"><em>Сводка по слайдам:</em></p>
        <ul>${statsData.slides_summary.map(s => `<li>${s.slide}: ${s.count} файлов, находок: ${s.positive}, ошибок: ${s.errors}</li>`).join('')}</ul>
      `;
    }

    function renderSlideTabs() {
      const container = document.getElementById('slideSelector');
      if (!container) return;
      container.innerHTML = '';
      for (const sid of Object.keys(slidesData)) {
        const stats = slidesData[sid].stats;
        let dot = 'clean';
        if (stats.positive > 0 && stats.errors > 0) dot = 'pos';
        else if (stats.positive > 0) dot = 'pos';
        else if (stats.errors > 0) dot = 'err';
        else if (stats.pendingReview > 0) dot = 'pend';
        const tab = document.createElement('div');
        tab.className = 'slide-tab' + (sid === selectedSlideId ? ' active' : '');
        tab.innerHTML = `<span class="tab-dot ${dot}"></span> ${sid} ${stats.positive ? `<span style="color:#dc2626;font-weight:700;">+${stats.positive}</span>`:''} ${stats.errors ? `<span style="color:#d97706;font-weight:700;">!${stats.errors}</span>`:''}`;
        tab.addEventListener('click', () => { selectedSlideId = sid; selectedScanIndex = null; switchView('batch'); });
        container.appendChild(tab);
      }
    }

    function renderStatsCards() {
      let pos = 0, neg = 0, err = 0, pend = 0;
      for (const s of Object.values(slidesData)) {
        pos += s.stats.positive; neg += s.stats.negative; err += s.stats.errors; pend += s.stats.pendingReview;
      }
      document.getElementById('statsCards').innerHTML = `
        <div class="stat-card pos"><div class="stat-value">${pos}</div><div class="stat-label">Находок</div></div>
        <div class="stat-card"><div class="stat-value">${neg}</div><div class="stat-label">Чистых</div></div>
        <div class="stat-card err"><div class="stat-value">${err}</div><div class="stat-label">Ошибок</div></div>
        <div class="stat-card pend"><div class="stat-value">${pend}</div><div class="stat-label">На проверке</div></div>
      `;
    }

             onclick="selectedSlideId='${id}'; switchView('batch');">
          <span style="font-weight:700;">${id}</span>

    function renderReviewList() {
      const container = document.getElementById('reviewList');
      if (!container) return;
      if (reviewQueue.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:50px;color:#16a34a;">Все стёкла проверены</div>';
        return;
      }
      container.innerHTML = reviewQueue.map((item, idx) => `
        <div class="review-queue-item" onclick="openReviewItem('${item.slideId}',${item.index})" style="${idx===0?'border-color:#1e4bd2;background:#eef4ff;':''}">
          <div class="mini-thumb"><canvas id="miniCanvas${idx}" width="52" height="52"></canvas></div>
          <div class="queue-item-info">
            <div class="queue-item-slide">${item.slideId} стекло ${item.index+1}</div>
            <div class="queue-item-meta">${item.scanData.scanType==='positive'?`Находка · ${item.scanData.numEggs} яиц · ${item.scanData.confidence}%`:`Ошибка: ${item.scanData.errorType||'неизвестно'}`}</div>
          </div>
          <div class="queue-actions">
            <button class="btn btn-confirm" style="padding:8px 16px;" onclick="event.stopPropagation();quickConfirm('${item.slideId}',${item.index})">Да</button>
            <button class="btn btn-reject" style="padding:8px 16px;" onclick="event.stopPropagation();quickReject('${item.slideId}',${item.index})">Нет</button>
          </div>
        </div>
      `).join('');
      setTimeout(() => {
        reviewQueue.forEach((item, idx) => {
          const canvas = document.getElementById('miniCanvas'+idx);
          if (!canvas) return;
          const img = new Image();
          img.onload = () => {
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, 52, 52);
            if (item.scanData.detections && item.scanData.detections.length > 0) {
              drawDetections(ctx, item.scanData.detections, img.naturalWidth, img.naturalHeight, 52, 52);
            }
          };
          img.src = item.scanData.imgUrl;
        });
      }, 10);
    }

    function openReviewItem(slideId, index) {
      selectedSlideId = slideId;
      selectedScanIndex = index;
      switchView('batch');
      setTimeout(() => {
        const tile = document.querySelector(`.scan-tile[data-key="${slideId}-${index}"]`);
        if (tile) {
          document.querySelectorAll('.scan-tile.selected').forEach(t => t.classList.remove('selected'));
          tile.classList.add('selected');
          tile.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        showDetail(slideId, index);
      }, 150);
    }

    async function quickConfirm(slideId, index) {
      await updateReviewStatus(slideId, index, 'confirmed');
      renderReviewList(); renderScanGrid(); renderSlideTabs();
      showToast(`Подтверждено — ${slideId} стекло ${index+1}`);
    }
    async function quickReject(slideId, index) {
      await updateReviewStatus(slideId, index, 'rejected');
      renderReviewList(); renderScanGrid(); renderSlideTabs();
      showToast(`Отклонено — ${slideId} стекло ${index+1}`);
    }

    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key.toLowerCase() === 'y' && selectedSlideId && selectedScanIndex !== null) { e.preventDefault(); confirmScan(); }
      else if (e.key.toLowerCase() === 'n' && selectedSlideId && selectedScanIndex !== null) { e.preventDefault(); rejectScan(); }
      else if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); skipScan(); }
      else if (e.key === '1') switchView('dashboard');
      else if (e.key === '2') switchView('batch');
      else if (e.key === '3') switchView('review');
    });

    document.querySelectorAll('.sidebar-nav .nav-item').forEach(item => {
      item.addEventListener('click', () => { const view = item.dataset.view; if (view) switchView(view); });
    });

    window.addEventListener('load', () => { fetchStatsData(); fetchSlidesData(); });
  </script>
</body>
</html>
